[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ncp"
version = "1.0.0"
description = "Concept-aware Network Pruning (CNP): pruning CNNs via disentangled concept subspaces"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kirin Danek" },
    { name = "Vikram V. Ramaswamy" },
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
data = ["certifi>=2023.0"]

[project.urls]
Repository = "https://github.com/KirinDanek/NCP.v2"
Paper = "https://xai4cv-workshop.github.io/xai4cv2026/assets/papers/PP29.pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncp = ["fonts/*.otf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
